<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | JPEG to SVG</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-icon">▧</span><span>JPEG to SVG</span></a><nav><a href="/">View website</a></nav></header><main class="admin-shell"><section id="login-panel" class="admin-box"><h1>Admin login</h1><p>Sign in to manage website settings.</p><form id="login-form"><label class="field"><span>Username</span><input name="username" autocomplete="username" required></label><label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Log in</button><p id="login-message" role="status"></p></form></section><section id="settings-panel" class="admin-box" hidden><h1>Website settings</h1><p class="notice">Settings are stored in the database. Keep private credentials out of public fields. Search Console verification and analytics IDs are identifiers, not passwords.</p><form id="settings-form"><label class="field"><span>SEO title</span><input name="title" maxlength="180"></label><label class="field"><span>Meta description</span><textarea name="description" maxlength="1000"></textarea></label><label class="field"><span>Homepage text</span><textarea name="homeText"></textarea></label><label class="field"><span>Tool instructions</span><textarea name="instructions"></textarea></label><label class="field"><span>Author name</span><input name="authorName"></label><label class="field"><span>Contact email</span><input name="contactEmail" type="email"></label><label class="field"><span>Contact phone</span><input name="contactPhone"></label><label class="field"><span>Contact address</span><textarea name="contactAddress"></textarea></label><label class="field"><span>Search Console verification content</span><input name="searchConsoleCode"></label><label class="field"><span>AdSense publisher ID</span><input name="adsensePublisherId" placeholder="pub-..."></label><label class="field"><span>Enable ads</span><input name="adsEnabled" type="checkbox"></label><label class="field"><span>Google Analytics measurement ID</span><input name="analyticsId" placeholder="G-XXXXXXXXXX"></label><label class="field"><span>About page text</span><textarea name="aboutContent"></textarea></label><label class="field"><span>Privacy page text</span><textarea name="privacyContent"></textarea></label><label class="field"><span>Contact page text</span><textarea name="contactContent"></textarea></label><label class="field"><span>Terms page text</span><textarea name="termsContent"></textarea></label><button class="primary-button" type="submit">Save settings</button> <button class="primary-button" type="button" id="logout-button">Log out</button><p id="settings-message" role="status"></p></form></section></main><footer class="site-footer"><span>Private administration</span><span>JPEG to SVG</span></footer><script src="/admin/admin.js"></script></body></html>
